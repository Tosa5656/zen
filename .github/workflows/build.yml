name: Build test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm parted mtools xorriso binutils-x86-64-linux-gnu

      - name: Install and configure x86_64 cross-compiler
        run: |
          sudo apt-get install -y gcc-x86-64-linux-gnu binutils-x86-64-linux-gnu
          sudo ln -s /usr/bin/x86_64-linux-gnu-gcc /usr/bin/x86_64-elf-gcc
          sudo ln -s /usr/bin/x86_64-linux-gnu-ld /usr/bin/x86_64-elf-ld

      - name: Run make
        run: make -j$(nproc)

      - name: Build disk image
        run: make image

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            zen.img
            release-version
            release-notes
