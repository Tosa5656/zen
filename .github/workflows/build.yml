name: Build test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm parted mtools
    - name: Install x86_64-elf-gcc
      run: |
        sudo apt-get install -y gcc-x86-64-linux-gnu
        sudo ln -s /usr/bin/x86_64-linux-gnu-gcc /usr/bin/x86_64-elf-gcc
    - name: Run make
      run: make
    - name: Build disk image
      run: make image
